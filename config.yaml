# League used when you don't pass --league NAME.
league: chuckle-nuts

# Your leagues. Any setting below (min_gain, trade_shapes, ...) can also go inside a league
# to override it for that league only.
leagues:
  chuckle-nuts:
    platform: sleeper
    # The number in your Sleeper league URL.
    league_id: "1389329636416061440"
    # Your Sleeper username or display name (used to find your roster).
    my_username: "adamDeez"
    # Scoring, in Sleeper stat names. Sleeper leagues read this from the league itself
    # (here: rec 0.5, pass_td 6); entries here replace individual settings.
    # scoring: {pass_td: 6}

  el-diablo:
    platform: espn
    # From your ESPN team page URL: ...?leagueId=344304&teamId=12&seasonId=2026
    league_id: "344304"
    team_id: 12
    # Private league: needs the espn_s2 / swid cookies in secrets.yaml.
    # Scoring and roster slots are read from ESPN (here: rec 1, pass_td 4).
    # ESPN's fantasy season ends week 16 here.
    final_week: 16

# --- Values ---
# Value = FantasyCalc rest-of-season value (or overrides.csv), times a scoring factor:
# the player's projected points under the league's scoring / under FantasyCalc's
# (4-pt passing TD, no TE premium). PPR is handled by fetching FantasyCalc at the league's
# PPR (0, 0.5 or 1). Byes and injuries are shown as tags but don't change value.
# Last week projected (for the scoring factor).
final_week: 17
# Upcoming weeks shown in the "Proj" column, bye tags and the ^ / ! flags.
short_term_weeks: 3

# --- Trade search ---
# Max allowed gap between the two sides' package values (0.10 = 10%).
fairness_tolerance: 0.10
# Allowed trade shapes as "give-get" from your side ("2-1" = you give 2, get 1).
trade_shapes: ["1-1", "1-2", "1-3", "2-1", "2-2", "2-3", "3-1", "3-2", "3-3"]
# Players below this value are ignored as trade pieces.
min_trade_value: 500
# Both teams must gain at least this much lineup value for a win-win suggestion.
min_gain: 50
# Labels in target/evaluate: a "fair" trade may cost the partner up to this much.
max_partner_loss: 150
# Trades rank by the SMALLER of the two lineup gains, so balanced deals come first.
# Each side that fills a weak starting spot boosts that by this much (0.25 = +25%).
need_bonus: 0.25
# Trades shown per partner in `partners`.
trades_per_partner: 3
# Top-N players by value get a * (elite / hard to pry loose).
star_count: 12

# Uneven trades: the side with more players cuts its lowest-value players; the side with
# fewer gets open roster spots, worth 0 (a free agent is available with or without the
# trade). The best free agent for the spot is shown as a hint, chosen from the top N per
# position by this week's projection.
waiver_candidates: 5

# --- Positional depth ---
# Bench players count per position: the 1st backup at a position earns 30% of his value,
# the 2nd 20%, ... while the position is under its depth target. Players beyond the target
# earn surplus_weight (a 3rd TE is worth far less than a 3rd RB).
bench_weights: [0.30, 0.20, 0.15, 0.10]
surplus_weight: 0.05
# Players per position a team keeps (starters + backups). Default: this league's average
# roster (currently QB 2, RB 5, WR 5, TE 2). Uncomment to override:
# depth_targets: {QB: 2, RB: 5, WR: 5, TE: 2}
# A TE only plays FLEX if his value x this beats the best RB/WR option (1.0 = no penalty).
te_flex_factor: 0.7
# Consolidation discount: best player in a package counts 100%, 2nd 80%, ...
package_weights: [1.0, 0.80, 0.65, 0.50]

# Manual rest-of-season value overrides (e.g. from peakedinhighskool's chart), on the
# FantasyCalc scale with standard scoring; the scoring factor still applies.
overrides_file: "overrides.csv"

cache_dir: ".cache"
cache_ttl_hours:
  players: 24      # Sleeper asks for at most one players fetch per day
  values: 6
  projections: 6
  league: 0.25
